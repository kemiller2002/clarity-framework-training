name: UI conformance

# visual-engineering/UI-LAYOUT-INTERACTION@1.0.0 browser evidence for the
# site GitHub Pages publishes from the repository root. Blocking: a failing
# assertion or an evidence document that does not validate fails the job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarity-training-ui-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tooling
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run UI conformance suite
        run: npm run ui:conformance
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-evidence
          path: test-results/ui-conformance-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
